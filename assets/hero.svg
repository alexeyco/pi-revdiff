<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" font-family="monospace">
  <rect width="800" height="120" rx="8" fill="#24283b"/>

  <!-- 1: Ctrl+R -->
  <rect x="40" y="30" width="140" height="60" rx="6" fill="#3d59a1" opacity="0.2"/>
  <text x="110" y="68" text-anchor="middle" fill="#7aa2f7" font-size="18" font-weight="bold">Ctrl+R</text>

  <line x1="190" y1="60" x2="230" y2="60" stroke="#565f89" stroke-width="2"/>
  <polygon points="230,56 240,60 230,64" fill="#565f89"/>

  <!-- 2: revdiff -->
  <rect x="250" y="30" width="140" height="60" rx="6" fill="#e0af68" opacity="0.15"/>
  <text x="320" y="68" text-anchor="middle" fill="#e0af68" font-size="18" font-weight="bold">review</text>

  <line x1="400" y1="60" x2="440" y2="60" stroke="#565f89" stroke-width="2"/>
  <polygon points="440,56 450,60 440,64" fill="#565f89"/>

  <!-- 3: annotations -->
  <rect x="460" y="30" width="140" height="60" rx="6" fill="#bb9af7" opacity="0.2"/>
  <text x="530" y="68" text-anchor="middle" fill="#bb9af7" font-size="18" font-weight="bold">annotate</text>

  <line x1="610" y1="60" x2="650" y2="60" stroke="#565f89" stroke-width="2"/>
  <polygon points="650,56 660,60 650,64" fill="#565f89"/>

  <!-- 4: fix -->
  <rect x="670" y="30" width="90" height="60" rx="6" fill="#9ece6a" opacity="0.15"/>
  <text x="715" y="68" text-anchor="middle" fill="#9ece6a" font-size="18" font-weight="bold">fix</text>
</svg>
